<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Readline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2F5D50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
:root{
  --bg:#F6F6F2;--surface:#FFFFFF;--ink:#1B1C1A;--muted:#6A6D66;--line:#E2E2DB;--hover:#EEEEE8;--hover-strong:color-mix(in srgb,var(--ink) 12%,var(--surface));
  --accent:#2F5D50;--accent-ink:#FFFFFF;--accent-soft:#E3ECE8;--danger:#9B3B2E;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.25,.6,.25,1);color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171816;--surface:#1E201D;--ink:#ECECE6;--muted:#9A9D94;--line:#2D2F2B;--hover:#262824;
  --accent:#7FB5A3;--accent-ink:#10201B;--accent-soft:#25332E;--danger:#D98577;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171816;--surface:#1E201D;--ink:#ECECE6;--muted:#9A9D94;--line:#2D2F2B;--hover:#262824;
  --accent:#7FB5A3;--accent-ink:#10201B;--accent-soft:#25332E;--danger:#D98577;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.app{max-width:1280px;margin:0 auto;padding:0 24px;min-height:100vh;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 18px;border-bottom:1px solid var(--line)}
.brand{font:500 26px/1 var(--serif);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{display:block;width:18px;height:2px;background:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;font-weight:500;transition:background .15s var(--ease),border-color .15s var(--ease),filter .15s var(--ease),transform .12s var(--ease)}
.btn:active{transform:scale(.985)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}

.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 360px;gap:0;flex:1}
.rail{padding:24px 24px 24px 0;border-right:1px solid var(--line)}
.rail h2{font:500 13px/1 var(--sans);color:var(--muted);margin:0 0 12px}
.rail ul{list-style:none;margin:0;padding:0}
.rail>div+div{margin-top:32px;padding-top:28px;border-top:1px solid var(--line)}
.rail li+li{margin-top:2px}
.mf{display:none}
.mf .dd-btn{background:var(--surface);padding:8px 10px}
.mf .dd-v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mf .dd-v .k{color:var(--muted)}
.mf .dd-v b{font-weight:500}
.mf .dd-opt .n{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.mf .dd-opt::after{content:"";flex:none;width:5px;height:9px;margin-left:10px;border:solid transparent;border-width:0 1.5px 1.5px 0;transform:rotate(40deg) translateY(-1px)}
.mf .dd-opt[aria-selected="true"]::after{border-color:var(--accent)}
.rail button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:7px 10px;margin-left:-10px;width:calc(100% + 10px);border-radius:6px;text-align:left;color:var(--ink)}
.rail button{transition:background .15s var(--ease),color .15s var(--ease),transform .12s var(--ease)}
.rail button:active{transform:scale(.985)}
.rail button:hover{background:var(--hover)}
.rail button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.rail button[aria-pressed="true"] .n{color:var(--accent)}

main{padding:24px 28px;min-width:0}
.search{position:relative;margin-bottom:6px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px 10px 36px;transition:border-color .15s}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.count{color:var(--muted);font-size:13px;margin:10px 0 4px}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:16px 10px;margin:0 -10px;border-bottom:1px solid var(--line);border-radius:6px;cursor:pointer;transition:background .15s var(--ease),transform .12s var(--ease)}
.row:hover{background:var(--hover)}
.row:active:not(:has(.dot:active)){transform:scale(.995)}
.row.fresh{animation:rise .18s var(--ease)}
.row[aria-current="true"]{background:var(--accent-soft)}
.dot{width:22px;height:22px;margin-top:3px;border-radius:50%;border:1.5px solid var(--muted);background:none;padding:0;position:relative;transition:border-color .15s var(--ease),background-color .15s var(--ease),transform .12s var(--ease)}
.dot:active{transform:scale(.92)}
.dot:hover{border-color:var(--accent)}
.dot[data-s="Reading"]{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot[data-s="Done"]{border-color:var(--accent);background:var(--accent)}
.dot[data-s="Done"]::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(40deg)}
.t{font:500 19px/1.3 var(--serif);margin:0;letter-spacing:-.005em}
.row[data-s="Done"] .t{color:var(--muted)}
.meta{color:var(--muted);font-size:13px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 14px}
.snip{margin:6px 0 0;color:var(--muted);font:400 15px/1.5 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:64px 0;text-align:center;max-width:340px;margin:0 auto}
.empty h3{font:500 22px/1.3 var(--serif);margin:0 0 6px}
.empty p{color:var(--muted);margin:0 0 18px}

aside.detail{border-left:1px solid var(--line);padding:24px 0 24px 28px;min-width:0}
.detail .blank{color:var(--muted);font:italic 400 17px/1.5 var(--serif);padding-top:8px}
.detail h2{font:500 26px/1.2 var(--serif);margin:0 0 6px;letter-spacing:-.01em;overflow-wrap:anywhere}
.detail .src{color:var(--accent);font-size:14px;text-decoration:none;overflow-wrap:anywhere;border-bottom:1px solid transparent}
.detail a.src:hover{border-color:var(--accent)}
.detail .sub{color:var(--muted);font-size:13px;margin:6px 0 20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);margin-bottom:22px}
.seg button{border:0;background:none;padding:6px 14px;font-size:14px;border-right:1px solid var(--line);transition:background .15s var(--ease),color .15s var(--ease),transform .12s var(--ease)}
.seg button:active{transform:scale(.985)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover-strong)}
.seg button:focus-visible{background:var(--hover-strong);outline:2px solid var(--accent);outline-offset:-2px}
.seg button[aria-pressed="true"]:hover,.seg button[aria-pressed="true"]:focus-visible{background:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.detail label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.detail textarea{width:100%;min-height:200px;resize:none;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;font:400 17px/1.6 var(--serif);transition:border-color .15s}
.detail textarea:focus{outline:none;border-color:var(--accent)}
.detail .acts{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.saved{font-size:13px;color:var(--muted);opacity:0;transition:opacity .2s}
.saved.on{opacity:1}
.back{display:none}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(20,22,20,.45)}
dialog form{padding:24px;display:grid;gap:16px}
dialog h2{font:500 24px/1.2 var(--serif);margin:0}
.f{display:grid;gap:6px}
.f label{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
.f textarea{min-height:90px;max-height:180px;resize:none;font-family:var(--serif);font-size:16px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dacts{display:flex;justify-content:flex-end;gap:8px}
.f input,.f textarea{transition:border-color .15s var(--ease)}

.dd{position:relative}
.dd-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;text-align:left;transition:border-color .15s var(--ease),transform .12s var(--ease)}
.dd-btn:hover{border-color:var(--muted)}
.dd-btn:active{transform:scale(.985)}
.dd.open .dd-btn{border-color:var(--accent)}
.dd-btn svg{flex:none;color:var(--muted);transition:transform .16s var(--ease)}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;list-style:none;margin:0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .14s var(--ease),transform .14s var(--ease),visibility .14s}
.dd.open .dd-list{opacity:1;visibility:visible;transform:none}
.dd-opt{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:5px;cursor:pointer;transition:background .12s var(--ease),color .12s var(--ease)}
.dd-opt[data-active="true"]{background:var(--hover-strong)}
.dd-opt[aria-selected="true"][data-active="true"]{background:var(--accent-soft)}
.dd-opt:active{background:var(--accent-soft)}
.dd-opt[aria-selected="true"]{color:var(--accent);font-weight:600}
.dd-opt[aria-selected="true"]::after{content:"";width:5px;height:9px;border:solid var(--accent);border-width:0 1.5px 1.5px 0;transform:rotate(40deg) translateY(-1px)}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dlgIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
dialog[open]{animation:dlgIn .18s var(--ease)}
dialog[open]::backdrop{animation:fade .18s ease}
.detail.swap>*{animation:fade .16s var(--ease)}

@media (max-width:1020px){
  .layout{grid-template-columns:170px minmax(0,1fr)}
  aside.detail{position:fixed;inset:0;z-index:20;background:var(--bg);border:0;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(100%);visibility:hidden;transition:transform .18s var(--ease),visibility .18s}
  aside.detail.open{transform:none;visibility:visible}
  .back{display:inline-block;margin-bottom:16px}
}
@media (max-width:700px){
  .app{padding:0 16px}
  .layout{grid-template-columns:minmax(0,1fr);align-content:start}
  .rail{align-self:start}
  .rail{border:0;border-bottom:1px solid var(--line);padding:14px 0 12px;display:flex;flex-direction:column;gap:8px;overflow:visible}
  .rail h2{margin:0;flex:none;width:44px;font-size:12px;line-height:32px;white-space:nowrap}
  .rail ul{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:6px;margin:-2px;padding:2px;flex:1;min-width:0}
  .rail ul::-webkit-scrollbar{display:none}
  .rail li{flex:none}
  .rail li+li{margin-top:0}
  .rail>div{display:flex;align-items:flex-start;gap:8px;min-width:0}
  .rail>div+div{margin:0;padding:0;border:0}
  .rail>div:not(.mf){display:none}
  .rail>.mf{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch;margin:0}
  .mf>.dd{min-width:0}
  .mf .dd-btn{width:100%;height:40px;margin:0;padding:0 12px;gap:8px;border-radius:6px;font-size:14px;white-space:nowrap}
  .mf .dd-list{display:flex;flex-direction:column;flex-wrap:nowrap;gap:2px;margin:0;padding:4px;flex:none;min-width:0;overflow-x:hidden;overflow-y:auto;max-height:240px;scrollbar-width:thin}
  .mf .dd-list::-webkit-scrollbar{display:block;width:6px}
  .mf .dd-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;margin:0;font-size:14px}
  .mf .dd-opt .n{min-width:2ch;text-align:right}
  main .search{margin:0}
  main .count{margin:10px 0 4px;min-height:20px}
  .rail button{width:auto;margin:0;border:1px solid var(--line);border-radius:999px;padding:5px 10px;gap:6px;font-size:13px;white-space:nowrap}
  .rail button[aria-pressed="true"]{border-color:var(--accent)}
  .rail .n{font-size:12px}
  main{padding:12px 0 28px}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

[hidden]{display:none!important}
.hright{display:flex;align-items:center;gap:8px;min-width:0}
.who{color:var(--muted);font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:6px}
.auth{min-height:100vh;display:grid;place-items:center;padding:32px 20px}
.auth-box{width:min(380px,100%)}
.auth h1{font:500 32px/1.15 var(--serif);letter-spacing:-.01em;margin:36px 0 6px}
.auth-sub{color:var(--muted);margin:0 0 26px}
.auth form{display:grid;gap:16px}
.auth .f input{background:var(--surface)}
.hint{font-size:13px;color:var(--muted)}
.err{margin:0;color:var(--danger);font-size:14px}
.wide{width:100%;padding:10px 14px}
.btn:disabled{opacity:.6;cursor:default}
.auth-alt{margin:22px 0 0;color:var(--muted);font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:500;border-bottom:1px solid transparent;transition:border-color .15s var(--ease)}
.linkbtn:hover{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .15s var(--ease),transform .15s var(--ease);z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){.who{display:none}}
</style>
</head>
<body>
<section class="auth" id="auth" hidden>
  <div class="auth-box">
    <div class="brand"><i></i>Readline</div>
    <h1 id="authTitle">Sign in</h1>
    <p class="auth-sub" id="authSub">Pick up where you left off.</p>
    <form id="authForm" novalidate>
      <div class="f"><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" maxlength="254" required></div>
      <div class="f"><label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password" maxlength="72" required><span class="hint" id="aHint" hidden>Use 8 to 72 characters.</span></div>
      <p class="err" id="authErr" role="alert" hidden></p>
      <button class="btn primary wide" type="submit" id="authSubmit">Sign in</button>
    </form>
    <p class="auth-alt"><span id="altText">New to Readline?</span> <button type="button" class="linkbtn" id="authToggle">Create an account</button></p>
  </div>
</section>
<div class="app" id="appRoot" hidden>
  <header class="top">
    <div class="brand"><i></i>Readline</div>
    <div class="hright">
      <span class="who" id="who"></span>
      <button class="btn" id="logoutBtn">Log out</button>
      <button class="btn primary" id="addBtn">Add item</button>
    </div>
  </header>

  <div class="layout">
    <nav class="rail" aria-label="Filters">
      <div>
        <h2>Status</h2>
        <ul id="statusF"></ul>
      </div>
      <div>
        <h2>Type</h2>
        <ul id="typeF"></ul>
      </div>
    <div class="mf"><div class="dd" id="mfStatus"></div><div class="dd" id="mfType"></div></div>
    </nav>

    <main>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search titles and notes" aria-label="Search titles and notes" autocomplete="off">
      </div>
      <div class="count" id="count" aria-live="polite"></div>
      <ul class="list" id="list"></ul>
    </main>

    <aside class="detail" id="detail" aria-label="Item details"></aside>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<dialog id="dlg">
  <form id="form" method="dialog">
    <h2>Add to your list</h2>
    <div class="f"><label for="fTitle">Title</label><input id="fTitle" required maxlength="140"></div>
    <div class="f"><label for="fSrc">URL or source</label><input id="fSrc" placeholder="https://… or &ldquo;Library copy&rdquo;" maxlength="300"></div>
    <div class="two">
      <div class="f"><label for="fTypeBtn">Type</label>
        <div class="dd" id="fType"></div></div>
      <div class="f"><label for="fStatusBtn">Status</label>
        <div class="dd" id="fStatus"></div></div>
    </div>
    <div class="f"><label for="fNotes">Notes</label><textarea id="fNotes" placeholder="Why it’s on your list, or what to look for"></textarea></div>
    <p class="err" id="formErr" role="alert" hidden></p>
    <div class="dacts">
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button type="submit" class="btn primary">Save item</button>
    </div>
  </form>
</dialog>

<script>
const STATUSES=['Unread','Reading','Done'], TYPES=['Article','Paper','Book','Video'];
let items=[];
let user=null;
const f={status:'All',type:'All',q:''};
let sel=null,fresh=null;const mfSync=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isUrl=s=>/^https?:\/\//i.test(s);
const nextStatus=s=>STATUSES[(STATUSES.indexOf(s)+1)%3];

function filtered(){
  const q=f.q.trim().toLowerCase();
  return items.filter(i=>(f.status==='All'||i.status===f.status)&&(f.type==='All'||i.type===f.type)&&
    (!q||i.title.toLowerCase().includes(q)||i.notes.toLowerCase().includes(q)));
}
function railRender(){
  const mk=(key,opts,total,fn)=>['All',...opts].map(o=>{
    const n=o==='All'?total:fn(o);
    return `<li><button aria-pressed="${f[key]===o}" data-k="${key}" data-v="${o}"><span>${o==='All'?'All':o}</span><span class="n">${n}</span></button></li>`}).join('');
  $('#statusF').innerHTML=mk('status',STATUSES,items.length,o=>items.filter(i=>i.status===o).length);
  $('#typeF').innerHTML=mk('type',TYPES,items.length,o=>items.filter(i=>i.type===o).length);
  mfSync.forEach(fn=>fn());
}
function listRender(){
  const r=filtered();
  $('#count').textContent=r.length===1?'1 item':r.length+' items';
  if(!r.length){
    const any=items.length>0;
    $('#list').innerHTML=`<li class="empty"><h3>${any?'Nothing matches':'Your list is empty'}</h3><p>${any?'Try a different search or clear the filters.':'Add an article, paper, book, or video to get started.'}</p><button class="btn ${any?'':'primary'}" id="emptyAct">${any?'Clear filters':'Add item'}</button></li>`;
    return;
  }
  $('#list').innerHTML=r.map(i=>`
   <li class="row${fresh===i.id?' fresh':''}" data-id="${i.id}" data-s="${i.status}" ${sel===i.id?'aria-current="true"':''} tabindex="0">
     <button class="dot" data-s="${i.status}" data-act="cycle" aria-label="Status: ${i.status}. Change to ${nextStatus(i.status)}" title="${i.status}. Click to mark ${nextStatus(i.status)}"></button>
     <div>
       <h3 class="t">${esc(i.title)}</h3>
       <div class="meta"><span>${i.type}</span><span>${esc(i.src||'No source')}</span><span>${i.status}</span></div>
       ${i.notes?`<p class="snip">${esc(i.notes)}</p>`:''}
     </div>
   </li>`).join('');
}
function detailRender(){
  const d=$('#detail'), i=items.find(x=>x.id===sel);
  if(!i){d.classList.remove('open');d.innerHTML='<div class="blank">Select an item to read or edit its notes.</div>';return}
  d.innerHTML=`
   <button class="btn back" id="back">Back to list</button>
   <h2>${esc(i.title)}</h2>
   ${isUrl(i.src)?`<a class="src" href="${esc(i.src)}" target="_blank" rel="noopener noreferrer">${esc(i.src.replace(/^https?:\/\//,''))}</a>`:`<span class="src" style="color:var(--muted)">${esc(i.src||'No source')}</span>`}
   <div class="sub">${i.type}, added ${i.added}</div>
   <div class="seg" role="group" aria-label="Status">${STATUSES.map(s=>`<button data-set="${s}" aria-pressed="${i.status===s}">${s}</button>`).join('')}</div>
   <label for="notes">Notes</label>
   <textarea id="notes" placeholder="Nothing here yet. Jot down what stood out.">${esc(i.notes)}</textarea>
   <div class="acts"><button class="btn danger" id="del">Delete</button><span class="saved" id="saved">Saved</span></div>`;
  grow($('#notes'));
}
function renderAll(){railRender();listRender();detailRender()}
function openItem(id){const changed=sel!==id;sel=id;listRender();detailRender();const d=$('#detail');if(changed){d.classList.remove('swap');void d.offsetWidth;d.classList.add('swap');setTimeout(()=>d.classList.remove('swap'),220)}d.classList.add('open')}
async function setStatus(i,s){
  const prev=i.status;if(!i||prev===s)return;
  i.status=s;renderAll();
  try{const u=await api('PATCH','/api/items/'+i.id,{status:s});i.status=u.status}
  catch(e){if(!e.auth){i.status=prev;renderAll();toast(e.message)}}
}
async function removeItem(id){
  const p=pend.get(id);if(p){clearTimeout(p.t);pend.delete(id)}
  try{await api('DELETE','/api/items/'+id);items=items.filter(x=>x.id!==id);if(sel===id)sel=null;renderAll()}
  catch(e){if(!e.auth)toast(e.message)}
}

document.addEventListener('click',e=>{
  const t=e.target;
  const fb=t.closest('[data-k]');
  if(fb){f[fb.dataset.k]=fb.dataset.v;railRender();listRender();return}
  if(t.id==='emptyAct'){ if(items.length){f.status='All';f.type='All';f.q='';$('#q').value='';railRender();listRender()}else openDlg();return}
  const cyc=t.closest('[data-act="cycle"]');
  if(cyc){e.stopPropagation();const i=items.find(x=>x.id==cyc.closest('.row').dataset.id);setStatus(i,nextStatus(i.status));return}
  const row=t.closest('.row');
  if(row){openItem(row.dataset.id);return}
  const st=t.closest('[data-set]');
  if(st){const i=items.find(x=>x.id===sel);setStatus(i,st.dataset.set);$('#detail').classList.add('open');return}
  if(t.id==='back'){$('#detail').classList.remove('open');return}
  if(t.id==='del'){
    const i=items.find(x=>x.id===sel);
    if(t.dataset.confirm){removeItem(sel)}
    else{t.dataset.confirm='1';t.textContent='Confirm delete';setTimeout(()=>{if(t.isConnected){delete t.dataset.confirm;t.textContent='Delete'}},3000)}
  }
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('row')){e.preventDefault();openItem(e.target.dataset.id)}
  if(e.key==='Escape')$('#detail').classList.remove('open');
});
$('#q').addEventListener('input',e=>{f.q=e.target.value;listRender()});
let tm;
document.addEventListener('input',e=>{
  if(e.target.tagName==='TEXTAREA')grow(e.target);
  if(e.target.id!=='notes')return;
  const i=items.find(x=>x.id===sel);if(!i)return;i.notes=e.target.value;listRender();saveNotes(i);
});

const dlg=$('#dlg');
function grow(t){if(!t)return;t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'}
function makeDD(el,opts,def){
  let val=def,act=0;
  el.innerHTML=`<button type="button" class="dd-btn" id="${el.id}Btn" aria-haspopup="listbox" aria-expanded="false"><span></span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><ul class="dd-list" role="listbox">${opts.map(o=>`<li class="dd-opt" role="option" data-v="${o}">${o}</li>`).join('')}</ul>`;
  const btn=el.firstElementChild,list=el.lastElementChild,os=[...list.children];
  const paint=()=>{btn.firstElementChild.textContent=val;os.forEach((o,k)=>{o.setAttribute('aria-selected',String(o.dataset.v===val));o.dataset.active=String(k===act)})};
  const isOpen=()=>el.classList.contains('open');
  const open=()=>{act=Math.max(0,opts.indexOf(val));paint();el.classList.add('open');btn.setAttribute('aria-expanded','true')};
  const close=focus=>{el.classList.remove('open');btn.setAttribute('aria-expanded','false');if(focus)btn.focus()};
  const pick=v=>{val=v;el.dataset.value=v;paint();close(true)};
  el.dataset.value=val;paint();
  btn.addEventListener('click',()=>isOpen()?close():open());
  list.addEventListener('click',e=>{const o=e.target.closest('.dd-opt');if(o)pick(o.dataset.v)});
  list.addEventListener('mousemove',e=>{const o=e.target.closest('.dd-opt');if(o&&os.indexOf(o)!==act){act=os.indexOf(o);paint()}});
  el.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&isOpen()){e.preventDefault();e.stopPropagation();close(true);return}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!isOpen()){open();return}act=(act+(e.key==='ArrowDown'?1:opts.length-1))%opts.length;paint()}
    else if(isOpen()&&e.key==='Home'){e.preventDefault();act=0;paint()}
    else if(isOpen()&&e.key==='End'){e.preventDefault();act=opts.length-1;paint()}
    else if(isOpen()&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(opts[act])}
    else if(isOpen()&&e.key==='Tab')close();
  });
  el.addEventListener('keyup',e=>{if(e.key===' ')e.preventDefault()});
  document.addEventListener('click',e=>{if(!el.contains(e.target))close()});
  el.reset=()=>{val=def;el.dataset.value=def;close();paint()};
}
makeDD($('#fType'),TYPES,'Article');
makeDD($('#fStatus'),STATUSES,'Unread');
function makeFilterDD(el,key,label,opts){
  const all=['All',...opts];let act=0;
  el.innerHTML=`<button type="button" class="dd-btn" id="${el.id}Btn" aria-haspopup="listbox" aria-expanded="false"><span class="dd-v"><span class="k">${label}:</span> <b></b></span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><ul class="dd-list" role="listbox" aria-label="${label}">${all.map(o=>`<li class="dd-opt" role="option" data-v="${o}"><span>${o}</span><span class="n"></span></li>`).join('')}</ul>`;
  const btn=el.firstElementChild,list=el.lastElementChild,val=btn.querySelector('b'),os=[...list.children];
  const isOpen=()=>el.classList.contains('open');
  const hl=()=>os.forEach((o,k)=>o.dataset.active=String(k===act));
  const sync=()=>{val.textContent=f[key];os.forEach(o=>{const v=o.dataset.v;o.setAttribute('aria-selected',String(f[key]===v));o.lastElementChild.textContent=v==='All'?items.length:items.filter(i=>i[key]===v).length})};
  const open=()=>{act=Math.max(0,all.indexOf(f[key]));hl();el.classList.add('open');btn.setAttribute('aria-expanded','true')};
  const close=focus=>{el.classList.remove('open');btn.setAttribute('aria-expanded','false');if(focus)btn.focus()};
  const pick=v=>{f[key]=v;close(true);railRender();listRender()};
  btn.addEventListener('click',()=>isOpen()?close():open());
  list.addEventListener('click',e=>{const o=e.target.closest('.dd-opt');if(o)pick(o.dataset.v)});
  list.addEventListener('mousemove',e=>{const o=e.target.closest('.dd-opt');if(o&&os.indexOf(o)!==act){act=os.indexOf(o);hl()}});
  el.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&isOpen()){e.preventDefault();e.stopPropagation();close(true);return}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!isOpen()){open();return}act=(act+(e.key==='ArrowDown'?1:all.length-1))%all.length;hl()}
    else if(isOpen()&&e.key==='Home'){e.preventDefault();act=0;hl()}
    else if(isOpen()&&e.key==='End'){e.preventDefault();act=all.length-1;hl()}
    else if(isOpen()&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(all[act])}
    else if(isOpen()&&e.key==='Tab')close();
  });
  el.addEventListener('keyup',e=>{if(e.key===' ')e.preventDefault()});
  document.addEventListener('click',e=>{if(!el.contains(e.target))close()});
  mfSync.push(sync);sync();
}
makeFilterDD($('#mfStatus'),'status','Status',STATUSES);
makeFilterDD($('#mfType'),'type','Type',TYPES);
function openDlg(){$('#form').reset();$('#fType').reset();$('#fStatus').reset();dlg.showModal();grow($('#fNotes'));$('#fTitle').focus()}
$('#addBtn').addEventListener('click',openDlg);
$('#cancel').addEventListener('click',()=>dlg.close());
$('#form').addEventListener('submit',async e=>{
  e.preventDefault();
  const title=$('#fTitle').value.trim();if(!title)return;
  const b=e.submitter,err=$('#formErr');if(b)b.disabled=true;err.hidden=true;
  try{
    const it=await api('POST','/api/items',{title,src:$('#fSrc').value.trim(),type:$('#fType').dataset.value,status:$('#fStatus').dataset.value,notes:$('#fNotes').value.trim(),
      added:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})});
    items.unshift(it);fresh=it.id;setTimeout(()=>{fresh=null},400);f.status='All';f.type='All';f.q='';$('#q').value='';sel=it.id;renderAll();dlg.close();
  }catch(ex){if(ex.auth)dlg.close();else{err.textContent=ex.message;err.hidden=false}}
  finally{if(b)b.disabled=false}
});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* ---------- API + auth ---------- */
async function api(method,url,body){
  let res;
  try{
    res=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined});
  }catch{throw new Error('Network error. Check your connection and try again.')}
  let data=null;try{data=await res.json()}catch{}
  if(!res.ok){
    const e=new Error((data&&data.error)||'Something went wrong. Please try again.');
    if(res.status===401&&!url.startsWith('/api/auth/')){e.auth=true;showAuth('login','Your session has expired. Please sign in again.')}
    throw e;
  }
  return data;
}
let tt;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3500)}

const pend=new Map();
function saveNotes(i){
  const old=pend.get(i.id);if(old)clearTimeout(old.t);
  const t=setTimeout(async()=>{
    pend.delete(i.id);
    try{
      await api('PATCH','/api/items/'+i.id,{notes:i.notes});
      const s=sel===i.id&&$('#saved');
      if(s){s.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>s.classList.remove('on'),1200)}
    }catch(e){if(!e.auth)toast('Couldn’t save your notes. '+e.message)}
  },600);
  pend.set(i.id,{t,i});
}
async function flushNotes(){
  const all=[...pend.values()];pend.clear();all.forEach(p=>clearTimeout(p.t));
  await Promise.allSettled(all.map(p=>api('PATCH','/api/items/'+p.i.id,{notes:p.i.notes})));
}

let mode='login';
function showAuthErr(msg){const el=$('#authErr');el.textContent=msg||'';el.hidden=!msg}
function setMode(m){
  mode=m;const reg=m==='register';
  $('#authTitle').textContent=reg?'Create your account':'Sign in';
  $('#authSub').textContent=reg?'Your reading list stays private to you.':'Pick up where you left off.';
  $('#authSubmit').textContent=reg?'Create account':'Sign in';
  $('#altText').textContent=reg?'Already have an account?':'New to Readline?';
  $('#authToggle').textContent=reg?'Sign in':'Create an account';
  $('#aPass').autocomplete=reg?'new-password':'current-password';
  $('#aHint').hidden=!reg;showAuthErr('');
}
function showAuth(m,msg){
  user=null;items=[];sel=null;pend.forEach(p=>clearTimeout(p.t));pend.clear();
  if(dlg.open)dlg.close();
  $('#detail').classList.remove('open');
  $('#appRoot').hidden=true;$('#auth').hidden=false;
  setMode(m||'login');if(msg)showAuthErr(msg);
}
async function enterApp(u){
  user=u;$('#who').textContent=u.email;
  $('#auth').hidden=true;$('#appRoot').hidden=false;
  f.status='All';f.type='All';f.q='';$('#q').value='';items=[];sel=null;
  $('#count').textContent='';
  $('#list').innerHTML='<li class="empty"><p>Loading your list…</p></li>';
  railRender();detailRender();
  try{items=await api('GET','/api/items')}catch(e){if(e.auth)return;toast(e.message)}
  sel=items.length?items[0].id:null;renderAll();
}
$('#authForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('#aEmail').value.trim(),password=$('#aPass').value;
  if(!email||!password)return showAuthErr('Enter your email and password.');
  if(mode==='register'&&password.length<8)return showAuthErr('Use at least 8 characters for your password.');
  const b=$('#authSubmit');b.disabled=true;showAuthErr('');
  try{const r=await api('POST','/api/auth/'+mode,{email,password});$('#aPass').value='';await enterApp(r.user)}
  catch(err){showAuthErr(err.message)}
  finally{b.disabled=false}
});
$('#authToggle').addEventListener('click',()=>{setMode(mode==='login'?'register':'login');$('#aEmail').focus()});
$('#logoutBtn').addEventListener('click',async()=>{
  await flushNotes();
  try{await api('POST','/api/auth/logout')}catch{}
  showAuth('login');
});
(async function boot(){
  try{const r=await api('GET','/api/auth/me');await enterApp(r.user)}
  catch{showAuth('login')}
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
